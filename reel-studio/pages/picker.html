<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio · Pick</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1b1b1a; --muted:#6b6a66; --line:#e4e2dc; --yes:#1f7a4d; --no:#b3261e; --pick:#2b59c3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1d; --text:#f1f0ec; --muted:#a3a29d; --line:#333; --yes:#4cc38a; --no:#ff7b72; --pick:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 16px; }
  .wrap { max-width:1200px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .intro { color:var(--muted); margin:0; max-width:70ch; }
  .bar { display:flex; gap:12px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .count { color:var(--muted); font-size:14px; }
  main { padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .item { background:var(--card); border:2px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .item.yes { border-color:var(--yes); } .item.no { border-color:var(--no); opacity:.75; } .item.chosen { border-color:var(--pick); }
  .item img { width:100%; aspect-ratio:9/16; object-fit:cover; background:#000; display:block; cursor:zoom-in; }
  .body { padding:10px; display:flex; flex-direction:column; gap:8px; }
  .cap { font-size:13px; color:var(--muted); }
  .btns { display:flex; gap:8px; }
  button { font:inherit; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--text); padding:8px 12px; cursor:pointer; flex:1; }
  button.on.y { background:var(--yes); border-color:var(--yes); color:#fff; }
  button.on.n { background:var(--no); border-color:var(--no); color:#fff; }
  button.on.c { background:var(--pick); border-color:var(--pick); color:#fff; }
  button.done { flex:0 0 auto; background:var(--text); color:var(--bg); border-color:var(--text); padding:10px 18px; font-weight:600; }
  textarea { font:inherit; font-size:14px; width:100%; min-height:56px; resize:vertical; border:1px solid var(--line); border-radius:10px; padding:8px; background:transparent; color:var(--text); }
  .saved { font-size:13px; color:var(--muted); }
  .msg { padding:12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); margin:12px 0; }
  dialog { border:0; padding:0; background:transparent; max-width:96vw; max-height:96vh; }
  dialog img { max-width:96vw; max-height:92vh; display:block; border-radius:10px; }
  dialog::backdrop { background:rgba(0,0,0,.8); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title">Loading…</h1>
  <p class="intro" id="intro"></p>
  <div class="bar">
    <span class="count" id="count"></span>
    <span class="saved" id="saved"></span>
    <span style="flex:1"></span>
    <button class="done" id="done">I'm done</button>
  </div>
</div></header>
<main class="wrap">
  <div class="msg" id="finished" hidden>Saved. Go back to Claude and say <b>done</b>.</div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="zoom"><img alt=""></dialog>
<script>
const name = new URLSearchParams(location.search).get("name") || "references";
let data, answers = { items: {} }, timer;
const $ = (id) => document.getElementById(id);

async function load() {
  const r = await fetch(`/api/data/${name}`);
  if (!r.ok) { $("title").textContent = "Nothing to show yet. Ask Claude to prepare this page."; return; }
  data = await r.json();
  const saved = await (await fetch(`/api/answers/${name}`)).json();
  if (saved.items) answers = saved;
  $("title").textContent = data.title || "Pick";
  $("intro").textContent = data.intro || (data.mode === "choose"
    ? "Choose the one you like most. Add a reason if you want."
    : "Say Yes or No to each picture. A short reason helps a lot: what do you like or dislike about it?");
  render();
}

function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  for (const it of data.items) {
    const a = answers.items[it.id] || {};
    const el = document.createElement("div");
    el.className = "item " + (a.pick || "");
    const btns = data.mode === "choose"
      ? `<button class="c ${a.pick === "chosen" ? "on" : ""}" data-p="chosen">${a.pick === "chosen" ? "Chosen" : "Choose this"}</button>`
      : `<button class="y ${a.pick === "yes" ? "on" : ""}" data-p="yes">Yes</button><button class="n ${a.pick === "no" ? "on" : ""}" data-p="no">No</button>`;
    el.innerHTML = `<img loading="lazy" alt="">
      <div class="body">${it.caption ? `<div class="cap"></div>` : ""}
        <div class="btns">${btns}</div>
        <textarea placeholder="Why? (optional)"></textarea></div>`;
    el.querySelector("img").src = "/" + it.img.replace(/^\/+/, "");
    if (it.caption) el.querySelector(".cap").textContent = it.caption;
    const ta = el.querySelector("textarea");
    ta.value = a.reason || "";
    ta.oninput = () => { set(it.id, { reason: ta.value }); };
    el.querySelector("img").onclick = () => { $("zoom").querySelector("img").src = el.querySelector("img").src; $("zoom").showModal(); };
    el.querySelectorAll("button").forEach((b) => b.onclick = () => {
      const p = b.dataset.p;
      if (data.mode === "choose") for (const k in answers.items) if (answers.items[k].pick === "chosen") answers.items[k].pick = "";
      set(it.id, { pick: (answers.items[it.id] || {}).pick === p ? "" : p });
      render();
    });
    grid.appendChild(el);
  }
  const n = Object.values(answers.items).filter((a) => a.pick).length;
  $("count").textContent = data.mode === "choose" ? (n ? "1 chosen" : "Nothing chosen yet") : `${n} of ${data.items.length} decided`;
}

function set(id, patch) {
  answers.items[id] = { ...(answers.items[id] || {}), ...patch };
  answers.done = false;
  $("finished").hidden = true;
  clearTimeout(timer);
  timer = setTimeout(save, 400);
}

async function save() {
  $("saved").textContent = "Saving…";
  const r = await fetch(`/api/answers/${name}`, { method: "POST", body: JSON.stringify(answers) });
  $("saved").textContent = r.ok ? "Saved" : "Could not save. Is Claude's helper still running?";
}

$("done").onclick = async () => { clearTimeout(timer); answers.done = true; await save(); $("finished").hidden = false; scrollTo(0, 0); };
$("zoom").onclick = () => $("zoom").close();
load();
</script>
</body>
</html>
